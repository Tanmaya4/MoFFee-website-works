<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D0D0D" />

    <!-- Fonts: preconnect + preload to avoid fallback flash in prod -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />
    <!-- Primary Meta Tags -->
    <title>MoFFee | Authentic Craft Beverages</title>
    <meta name="title" content="MoFFee | Authentic Craft Beverages" />
    <meta name="description" content="MoFFee - Authentic craft beverages. Discover our exquisite collection of handcrafted drinks." />
    <meta name="author" content="MoFFee" />
    <link rel="canonical" href="https://moffee.co.in" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moffee.co.in/" />
    <meta property="og:title" content="MoFFee | Authentic Craft Beverages" />
    <meta property="og:description" content="Authentic craft beverages. Discover our exquisite collection of handcrafted drinks." />
    <meta property="og:image" content="https://moffee.co.in/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://moffee.co.in/" />
    <meta property="twitter:title" content="MoFFee | Authentic Craft Beverages" />
    <meta property="twitter:description" content="Authentic craft beverages. Discover our exquisite collection of handcrafted drinks." />
    <meta property="twitter:image" content="https://moffee.co.in/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
